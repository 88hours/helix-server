version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
        environment:
          # Minimal stubs — tests mock all external calls, but the config
          # loader and env-var resolution still expect these to be set.
          ANTHROPIC_API_KEY: test-key
          OPENROUTER_API_KEY: test-key
          REDIS_URL: redis://localhost:6379
          ROLLBAR_ACCESS_TOKEN: test-token
          GITHUB_TOKEN: test-token
          SLACK_BOT_TOKEN: xoxb-test
          SLACK_SIGNING_SECRET: test-signing-secret
          SLACK_APPROVAL_CHANNEL: "#test"
          JIRA_URL: https://test.atlassian.net
          JIRA_EMAIL: test@test.com
          JIRA_TOKEN: test-token
          JIRA_PROJECT_KEY: TEST
          EMAIL_FROM: helix@test.com
          EMAIL_TO: oncall@test.com
      - image: cimg/redis:7.0
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:ahmQ7//T7KF7j0z6VjJXICSWKBU4AUyWOohjlELg5ew"
      - checkout
      - run:
          name: Skip if only markdown files changed
          command: |
            git diff --name-only origin/main...HEAD | grep -qv '\.md$' || circleci-agent step halt
      - run:
          name: Install dependencies
          command: pip install --editable ".[dev]"
      - run:
          name: Run tests
          command: pytest --tb=short -q

  docker-build:
    docker:
      - image: cimg/base:current
    resource_class: arm.medium
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:ahmQ7//T7KF7j0z6VjJXICSWKBU4AUyWOohjlELg5ew"
      - checkout
      - run:
          name: Skip if only markdown files changed
          command: |
            git diff --name-only origin/main...HEAD | grep -qv '\.md$' || circleci-agent step halt
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: docker build -t helix:$CIRCLE_SHA1 .

workflows:
  ci:
    jobs:
      - test
      - docker-build:
          requires:
            - test
