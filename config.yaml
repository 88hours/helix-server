# Helix – Configuration
#
# This file is the source of truth for all non-secret configuration.
# Secrets (API keys, tokens) must be set as environment variables — never
# committed to this file.
#
# All values here can be overridden by environment variables at runtime.
# See the override key for each section below.

# ---------------------------------------------------------------------------
# LLM providers
# ---------------------------------------------------------------------------
#
# provider options:
#   anthropic   — uses ANTHROPIC_API_KEY, direct Anthropic API
#   openrouter  — uses OPENROUTER_API_KEY, OpenAI-compatible API
#   claude-code — invokes the Claude Code CLI via subprocess (Dev Agent only)
#
# Per-agent overrides: HELIX_<AGENT>_PROVIDER and HELIX_<AGENT>_MODEL
#   e.g. HELIX_DEV_PROVIDER=anthropic, HELIX_DEV_MODEL=claude-sonnet-4-6

agents:
  crash_handler:
    provider: anthropic
    model: claude-haiku-4-5-20251001

  qa:
    provider: anthropic
    model: claude-haiku-4-5-20251001

  dev:
    provider: claude-code
    model: claude-sonnet-4-6

  code_quality:
    provider: anthropic
    model: claude-sonnet-4-6

# ---------------------------------------------------------------------------
# LLM API keys (set as environment variables — values here are placeholders)
# ---------------------------------------------------------------------------
#
# ANTHROPIC_API_KEY   — required if any agent uses provider: anthropic
# OPENROUTER_API_KEY  — required if any agent uses provider: openrouter

# ---------------------------------------------------------------------------
# Event bus
# ---------------------------------------------------------------------------
#
# backend options:
#   redis        — Redis Pub/Sub (default; recommended for Railway / local dev)
#   eventbridge  — AWS EventBridge (recommended for AWS deployments)
#
# Override: HELIX_EVENT_BACKEND

events:
  backend: redis

  # Redis Pub/Sub — used when backend is "redis"
  # Override: REDIS_URL (e.g. redis://localhost:6379 or rediss://... for TLS)
  redis:
    url_env: REDIS_URL          # name of the env var that holds the Redis URL

  # AWS EventBridge — used when backend is "eventbridge"
  # Override: HELIX_EVENTBRIDGE_BUS
  eventbridge:
    bus: helix-mvp              # EventBridge event bus name
    region_env: AWS_REGION      # name of the env var that holds the AWS region

# ---------------------------------------------------------------------------
# Redis state store
# ---------------------------------------------------------------------------
#
# Redis is used for shared incident state regardless of which event backend
# is chosen. All keys are namespaced by incident_id with a 7-day TTL.
#
# Override: REDIS_URL

redis:
  url_env: REDIS_URL            # name of the env var that holds the Redis URL
  ttl_days: 7                   # key expiry for all helix:incident:* keys

# ---------------------------------------------------------------------------
# Rollbar integration
# ---------------------------------------------------------------------------
#
# Helix verifies inbound Rollbar webhooks by comparing data.access_token in
# the payload against the project read token stored in ROLLBAR_ACCESS_TOKEN.
#
# Override: ROLLBAR_ACCESS_TOKEN

rollbar:
  access_token_env: ROLLBAR_ACCESS_TOKEN   # env var holding the Rollbar project read token

# ---------------------------------------------------------------------------
# GitHub integration
# ---------------------------------------------------------------------------
#
# Used by:
#   QA Agent      — reads source files from the target repo to write test cases
#   Dev Agent     — clones the target repo; the claude-code CLI runs inside it
#   Code Quality  — fetches PR diffs for review
#
# target_repo: the "owner/name" of the repo Helix is fixing bugs in.
#   e.g. "acme/backend"
#   Override: HELIX_GITHUB_REPO
#
# base_branch: the branch PRs are opened against (usually "main").
#   Override: HELIX_GITHUB_BASE_BRANCH
#
# token_env: env var holding the GitHub personal access token or App token.
#   Requires: repo scope (read + write + pull requests)

github:
  target_repo: "88hours/helix-test"                   # e.g. "acme/backend" — must be set
  base_branch: main
  token_env: GITHUB_TOKEN           # env var holding the GitHub token


# ---------------------------------------------------------------------------
# Slack integration
# ---------------------------------------------------------------------------
#
# Used by:
#   Code Quality Agent — posts the approval request with Approve/Reject buttons
#   Dev Agent          — posts an escalation message if all retries are exhausted
#
# approval_channel: the Slack channel ID (C...) or name (#channel) where
#   Helix posts PR reviews for human approval.
#   Override: SLACK_APPROVAL_CHANNEL
#
# token_env: env var holding the Slack bot token (xoxb-...).
#   Required scopes: chat:write, chat:write.public

slack:
  token_env: SLACK_BOT_TOKEN                     # bot token (xoxb-...) with chat:write scope
  signing_secret_env: SLACK_SIGNING_SECRET       # signing secret — used to verify button-click payloads
  approval_channel_env: SLACK_APPROVAL_CHANNEL   # channel ID or name for approval messages

  # Human Approval webhook server port (receives Slack button-click interactions)
  # Override: HELIX_APPROVAL_PORT
  approval_port: 8001

# ---------------------------------------------------------------------------
# Email integration
# ---------------------------------------------------------------------------
#
# Used alongside Slack for approval requests, Dev Agent escalations, and
# PR-merged confirmations. Supports any SMTP provider (Gmail, SendGrid,
# AWS SES, Mailgun, Postmark, etc.) via STARTTLS on port 587.
#
# Overrides: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, EMAIL_FROM, EMAIL_TO

email:
  # SendGrid API (preferred — set SENDGRID_API_KEY and SMTP vars are not needed)
  # Override: SENDGRID_API_KEY
  sendgrid_api_key_env: SENDGRID_API_KEY

  # SMTP fallback (used when SENDGRID_API_KEY is not set)
  # Works with Gmail, AWS SES, Mailgun, Postmark, etc.
  smtp_host_env: SMTP_HOST          # e.g. smtp.gmail.com or email-smtp.us-east-1.amazonaws.com
  smtp_port: 587                    # 587 = STARTTLS (recommended), 465 = SSL
  smtp_user_env: SMTP_USER          # SMTP username
  smtp_password_env: SMTP_PASSWORD  # SMTP password

  # Always required
  from_env: EMAIL_FROM              # sender address, e.g. helix@acme.com
  to_env: EMAIL_TO                  # comma-separated recipients, e.g. oncall@acme.com

# ---------------------------------------------------------------------------
# Pipeline behaviour
# ---------------------------------------------------------------------------
#
# Settings that control agent runtime behaviour.
# All values can be overridden by environment variables at runtime.

pipeline:
  # Maximum number of fix attempts the Dev Agent makes before escalating.
  # Counts across both test-suite failures and code-quality rejections.
  # Override: HELIX_DEV_MAX_ITERATIONS
  dev_max_iterations: 3

  # Maximum number of source files the QA Agent reads from the repo when
  # generating the test case (keeps LLM prompt size manageable).
  # Override: HELIX_QA_MAX_SOURCE_FILES
  qa_max_source_files: 8

  # Maximum characters read per source file by the QA Agent.
  # Override: HELIX_QA_MAX_FILE_CHARS
  qa_max_file_chars: 4000

  # Maximum characters of PR diff the Code Quality Agent sends to the LLM.
  # Diffs larger than this are truncated with a notice.
  # Override: HELIX_CQ_MAX_DIFF_CHARS
  cq_max_diff_chars: 12000

# ---------------------------------------------------------------------------
# Server (Crash Handler FastAPI app)
# ---------------------------------------------------------------------------
#
# Host and port for the Crash Handler webhook server.
# These are passed to uvicorn at startup — override via CLI args or env vars.
# Override: HELIX_SERVER_HOST, HELIX_SERVER_PORT

server:
  host: 0.0.0.0
  port: 8000
