name: Agent Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evals:
    name: Run LangSmith evals
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run evals
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: helix
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$LANGSMITH_API_KEY" ]; then
            echo "Skipping evals: ANTHROPIC_API_KEY or LANGSMITH_API_KEY secret not set."
            exit 0
          fi
          uv run python -m evals.run --experiment "ci-${{ github.sha }}"
