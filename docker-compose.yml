# ---------------------------------------------------------------------------
# Helix — full local stack
#
# Local Redis (default):
#   docker compose --profile local up --build
#
# External Redis (Redis Cloud, AWS ElastiCache, etc.):
#   Set REDIS_URL in .env, then:
#   docker compose up --build
#
# Individual service logs:
#   docker compose logs -f crash_handler
# ---------------------------------------------------------------------------

services:

  # -------------------------------------------------------------------------
  # Infrastructure — only started with: --profile local
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    profiles: [local]
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------------------
  # Helix agents
  #
  # REDIS_URL defaults to the local Redis container when --profile local is
  # used. Set REDIS_URL in .env to point agents at an external instance.
  #
  # depends_on.redis.required: false means agents start even when the local
  # Redis container is not present (i.e. when using an external Redis).
  # -------------------------------------------------------------------------
  crash_handler:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
        required: false
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    command: >
      uvicorn agents.crash_handler.main:app
        --host 0.0.0.0
        --port 8000

  qa:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
        required: false
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    command: python -m agents.qa.main

  dev:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
        required: false
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    command: python -m agents.dev.main

  notifier:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
        required: false
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    command: python -m agents.notifier.main

