# ---------------------------------------------------------------------------
# Helix — full local stack
#
# Start everything (Redis + Postgres included):
#   docker compose up --build
#
# External Redis / Postgres:
#   Set REDIS_URL / DATABASE_URL in .env to point at cloud instances.
#   The local containers default as fallback when those vars are not set.
#
# Individual service logs:
#   docker compose logs -f crash_handler
# ---------------------------------------------------------------------------

services:

  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: helix
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # Helix agents
  #
  # REDIS_URL and DATABASE_URL default to the local containers when not set
  # in .env. Set them in .env to point at external cloud instances instead.
  # -------------------------------------------------------------------------
  crash_handler:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://helix:helix@postgres:5432/helix}
    command: >
      uvicorn agents.crash_handler.main:app
        --host 0.0.0.0
        --port 8000

  qa:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://helix:helix@postgres:5432/helix}
    command: python -m agents.qa.main

  dev:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://helix:helix@postgres:5432/helix}
    command: python -m agents.dev.main
    deploy:
      replicas: 1

  notifier:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://helix:helix@postgres:5432/helix}
    command: python -m agents.notifier.main

